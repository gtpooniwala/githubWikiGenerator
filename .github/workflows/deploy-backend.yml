name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  PROJECT_ID: pushstart-481717
  SERVICE_NAME: wiki-generator-backend
  REGION: us-central1

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: |
          cd backend
          .venv/bin/python -m pytest -q --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: GCP Cloud Run
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions@pushstart-481717.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: pushstart-481717

      - name: Deploy to Cloud Run
        run: |
          cd backend
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},GITHUB_TOKEN=${{ secrets.GH_TOKEN }}"

      - name: Show URL
        run: |
          echo "Service deployed to:"
          gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)'
